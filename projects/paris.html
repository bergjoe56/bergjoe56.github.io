  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&#215;</button>
    <button class="lightbox-arrow prev" id="lightboxPrev">&#8592;</button>
    <div class="lightbox-img-wrap">
      <img src="" alt="" id="lightboxImg">
    </div>
    <button class="lightbox-arrow next" id="lightboxNext">&#8594;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <script>
    // Nav
    const toggle = document.getElementById('navToggle');
    const drawer = document.getElementById('navDrawer');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('open');
      drawer.classList.toggle('open');
    });

    // Lightbox
    const gallery = document.querySelectorAll('#parisGallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxCounter = document.getElementById('lightboxCounter');
    let current = 0;

    function openLightbox(index) {
      current = index;
      updateLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      lightboxImg.src = gallery[current].src;
      lightboxImg.alt = gallery[current].alt;
      lightboxCaption.textContent = gallery[current].dataset.caption;
      lightboxCounter.textContent = (current + 1) + ' / ' + gallery.length;
    }

    gallery.forEach((img, i) => {
      img.addEventListener('click', () => openLightbox(i));
    });

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', () => {
      current = (current - 1 + gallery.length) % gallery.length;
      updateLightbox();
    });
    document.getElementById('lightboxNext').addEventListener('click', () => {
      current = (current + 1) % gallery.length;
      updateLightbox();
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') { current = (current - 1 + gallery.length) % gallery.length; updateLightbox(); }
      if (e.key === 'ArrowRight') { current = (current + 1) % gallery.length; updateLightbox(); }
    });
  </script>
